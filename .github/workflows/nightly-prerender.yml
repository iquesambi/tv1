name: Nightly Pre-render & Deploy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Debug - show service account email (temporary, safe to remove)
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_TV1_SITE }}" > /tmp/sa.json
          node -e "console.log('client_email:', JSON.parse(require('fs').readFileSync('/tmp/sa.json','utf8')).client_email)"
          rm /tmp/sa.json

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TV1_SITE }}
          projectId: tv1-site
          channelId: live
          entryPoint: ./frontend

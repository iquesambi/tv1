name: Nightly Pre-render & Deploy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Garante que só um deploy roda por vez — disparos manuais em sequência rápida
# criavam versões concorrentes que disputavam pra "liberar" no canal live,
# causando o erro "supplied version is the current active version".
concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Sem isso, um travamento silencioso (ex: runner preso, registry do npm
    # instável) só encerraria no limite padrão de 6h — trava rápido e claro
    # em vez disso.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      # Deploy direto pelo CLI em vez da action wrapper. A rede do runner às
      # vezes derruba a conexão ("premature close error") e o firebase-tools
      # repete o POST que publica a versão. A 1ª tentativa já publicou com
      # sucesso, então a repetição falha com "is the current active version"
      # (HTTP 400) — um erro benigno que fazia o deploy aparecer como falho
      # mesmo tendo dado certo. Aqui tratamos esse caso específico como sucesso.
      - name: Write service account key
        run: printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TV1_SITE }}' > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy to Firebase
        working-directory: ./frontend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set +e
          # Versão fixa (não @latest) — evita o npx ter que resolver a versão
          # mais nova a cada run, o que já causou travamentos silenciosos se
          # o registro do npm estiver lento/instável.
          OUTPUT=$(npx firebase-tools@15.26.0 deploy --only hosting --project tv1-site 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ $CODE -ne 0 ] && echo "$OUTPUT" | grep -q "is the current active version"; then
            echo "::notice::A versão já foi publicada com sucesso (erro benigno de repetição). Tratando como sucesso."
            exit 0
          fi
          exit $CODE

      - name: Remove service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

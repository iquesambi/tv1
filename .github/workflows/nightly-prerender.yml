name: Nightly Pre-render & Deploy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Garante que só um deploy roda por vez — disparos manuais em sequência rápida
# criavam versões concorrentes que disputavam pra "liberar" no canal live,
# causando o erro "supplied version is the current active version".
concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TV1_SITE }}
          projectId: tv1-site
          channelId: live
          entryPoint: ./frontend
